[package]
name = "baarticle"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Nuckal777", "DHSN Dresden template contributors", "Elias Müller"]
license = "MIT"
description = "Template for papers and theses following the DHSN Dresden styleguide"
repository = "https://github.com/xNycrofox/dhsn-typst-template"
categories = ["thesis", "report"]
disciplines = []
compiler = "0.14.0"
homepage = "https://xnycrofox.github.io/dhsn-typst-template/"
exclude = ["docs", "examples", "images", "minimal.typ", "minimal.bib", "simple.typ", "cookbook.typ", "test.typ", ".github"]

[template]
path = "template"
entrypoint = "document.typ"
