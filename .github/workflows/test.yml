name: Test
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - name: Check that the version is consistent
        run: sh scripts/check-version.sh
      - name: Run tests
        run: typst compile --root . tests/test.typ
      - name: Compile examples
        run: |
          typst compile --root . examples/minimal.typ
          typst compile --root . examples/simple.typ
          typst compile --root . examples/cookbook.typ
      - name: Compile the starting point created by typst init
        run: |
          mkdir -p "$RUNNER_TEMP/packages/local/dhsnarticle"
          ln -s "$PWD" "$RUNNER_TEMP/packages/local/dhsnarticle/0.1.0"
          typst init --package-path "$RUNNER_TEMP/packages" @local/dhsnarticle:0.1.0 "$RUNNER_TEMP/paper"
          typst compile --package-path "$RUNNER_TEMP/packages" "$RUNNER_TEMP/paper/document.typ"
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: |
            examples/*.pdf
            tests/*.pdf
